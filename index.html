<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xem Mô Hình 3D</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ee; /* Đổi mã màu tại đây nếu bạn muốn màu nền khác */
      text-align: center;
      color: #294637;
    }

    h1 {
      padding: 12px 16px 0;
      margin: 0;
      font-size: 22px;
    }

    .toolbar {
      padding: 10px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .file-label {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      background: #294637;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    model-viewer {
      width: 100%;
      height: 75vh;
      background: transparent; /* Trong suốt để đồng nhất 1 màu với body */
      position: relative;
    }

    button[slot="ar-button"] {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 22px;
      border: 0;
      border-radius: 24px;
      background: #294637;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    p {
      padding: 0 16px;
      line-height: 1.6;
      margin: 8px 0;
    }
  </style>
</head>

<body>

  <model-viewer
    id="viewer"
    src="./20_10_2026.glb"
    alt="Mô hình 3D được quét bằng Polycam"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    touch-action="pan-y"
    ar
    ar-modes="webxr scene-viewer quick-look">

    <button slot="ar-button">
      Xem trong không gian thực — AR
    </button>
  </model-viewer>


  <script>
    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");

    viewer.addEventListener("load", () => {
     
    });

    viewer.addEventListener("error", () => {
      
    });

    viewer.addEventListener("ar-status", (event) => {
      if (event.detail.status === "failed") {
        status.textContent =
          "Không mở được AR. Hãy thử Safari trên iPhone hoặc Chrome trên Android có hỗ trợ AR.";
      }
    });
  </script>
</body>
</html>
